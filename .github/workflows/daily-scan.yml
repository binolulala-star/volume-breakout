name: Daily TWSE scan

on:
  schedule:
    # 台北時間（UTC+8）週一至週五 15:17 與 18:47；GitHub 排程可能延遲數十分鐘
    - cron: "17 7 * * 1-5"
    - cron: "47 10 * * 1-5"
  workflow_dispatch:        # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths: ["site/index.html", "site/scan.html", "scanner/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 第一次執行需回補約一年資料，約 15–25 分鐘
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 收集 TWSE 收盤行情並掃描
        run: python scanner/scan.py

      - name: 保存資料到 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A store site/data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "Daily scan $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
